<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="tobiiiiichi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="45%" stop-color="#111634"/>
      <stop offset="100%" stop-color="#1b1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="985" cy="70" r="230" fill="url(#glow)"/>
  <circle cx="140" cy="275" r="180" fill="url(#glow)" opacity="0.7"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif">
    <text x="88" y="150" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="1">tobiiiiichi</text>
    <text x="90" y="196" fill="#9aa4bf" font-size="22" letter-spacing="3">STAY CURIOUS · KEEP BUILDING</text>
    <text x="90" y="238" fill="#7d879e" font-size="19">保持好奇，持续构建</text>
  </g>

  <rect x="88" y="88" width="72" height="6" rx="3" fill="url(#accent)"/>
  <rect x="88" y="272" width="1024" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>

  <g transform="translate(1060,215)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="9" fill="url(#accent)"/>
